# Security scanning of the Java code with CodeQL.
# - Java only: the repository's JavaScript is vendored third-party UI assets (Swagger UI, bigdesk, ...).
# - build-mode none: CodeQL extracts Java straight from source, with no Maven build (faster, and no Maven Central
#   downloads, which get rate-limited on shared runners).
# - Default (security) query suite. The earlier security-and-quality suite produced ~650 style notes that no one
#   triaged.
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "29 12 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
